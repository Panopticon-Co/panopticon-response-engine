[project]
name = "panopticon-response-engine"
version = "0.1.0"
description = "Panopticon's Response Engine domain contract, policy, and lifecycle logic"
requires-python = ">=3.10"
dependencies = [
    "pydantic>=2.0",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["response_engine*"]

[tool.ruff]
line-length = 100
# tests/vendor/panopticon-contracts is a git submodule (a separate repository
# with its own lint policy) vendored only so tests/test_contract_fixtures.py
# can load its golden fixtures -- it is not this package's own source and
# must not be linted as if it were.
exclude = ["tests/vendor"]

[tool.ruff.lint]
select = ["E", "F", "I"]

[tool.pytest.ini_options]
testpaths = ["tests"]
