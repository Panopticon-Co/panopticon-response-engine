name: CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4
        with:
          # tests/vendor/panopticon-contracts is a git submodule holding the
          # canonical cross-repo fixtures tests/test_contract_fixtures.py
          # loads -- without this, actions/checkout leaves it as an empty
          # directory and every fixture-consumption test fails with
          # FileNotFoundError.
          submodules: true

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install package and dev dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e . pytest ruff

      - name: Lint
        run: ruff check .

      - name: Run test suite
        run: pytest -v
